<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>품질개선 유효성 검증</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--steel:#23456E;--steel2:#2F5A8C;--amber:#D9822B;--bg:#F2F4F7;--card:#fff;--line:#DDE2E9;--ink:#1D2530;--sub:#667085;--ok:#1F8A4C;--warn:#C27B12;--ng:#C0392B;--r:8px;--top:#202833;--nav:#1B2C45}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,'Malgun Gothic',system-ui,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--steel2)}
/* top bar */
.top{position:sticky;top:0;z-index:30;height:49px;background:var(--top);color:#fff;display:flex;align-items:center;gap:6px;padding:0 14px}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;margin-right:18px;white-space:nowrap}
.logo i{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:6px;background:var(--amber);color:#fff;font-style:normal;font-weight:800}
.logo small{font-weight:400;color:#AEB7C4;font-size:12px}
.menu{display:flex;gap:2px;height:100%}
.menu button{background:none;border:0;color:#C9D1DC;padding:0 14px;height:100%;cursor:pointer;border-bottom:3px solid transparent}
.menu button:hover{color:#fff}
.menu button.on{color:#fff;border-bottom-color:var(--amber);font-weight:600}
.sp{flex:1}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:#C9D1DC;white-space:nowrap}
.who b{color:#fff}
.dot{width:9px;height:9px;border-radius:50%;background:#98A2B3;display:inline-block}
.dot.ok{background:#3CCB7F}.dot.busy{background:#F5B83D;animation:bl 1s infinite}.dot.err{background:#F04438}
@keyframes bl{50%{opacity:.3}}
.hb{display:none;background:none;border:0;color:#fff;font-size:22px;padding:4px 8px;cursor:pointer}
.tbtn{background:#34404F;border:1px solid #4A5566;color:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font-size:13px}
/* mobile nav */
.nav{position:fixed;inset:0 auto 0 0;width:240px;background:var(--nav);color:#fff;z-index:50;transform:translateX(-100%);transition:.2s;padding:14px 0;display:flex;flex-direction:column}
.nav.open{transform:none}
.nav button.m{display:block;width:100%;text-align:left;background:none;border:0;color:#C9D1DC;padding:13px 20px;font-size:15px}
.nav button.m.on{background:#26406A;color:#fff;border-left:4px solid var(--amber)}
.nav .navwho{padding:14px 20px;border-top:1px solid #2E4466;margin-top:auto;font-size:13px}
.shade{position:fixed;inset:0;background:#0006;z-index:40;display:none}.shade.open{display:block}
/* layout */
main{max-width:1400px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.panel h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px}
.panel h3 .sp{flex:1}
.ph{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.ph h2{margin:0;font-size:19px}
.ph .code{color:var(--sub);font-size:12px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-top:3px solid var(--steel)}
.kpi .l{font-size:12px;color:var(--sub)}.kpi .v{font-size:24px;font-weight:700;margin-top:4px}.kpi .v small{font-size:12px;color:var(--sub);font-weight:400;margin-left:3px}
.kpi.a{border-top-color:var(--amber)}.kpi.g{border-top-color:var(--ok)}.kpi.r{border-top-color:var(--ng)}
.btn{background:#fff;border:1px solid #C5CCD6;border-radius:6px;padding:7px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#F6F8FA}
.btn.p{background:var(--steel);border-color:var(--steel);color:#fff}.btn.p:hover{background:var(--steel2)}
.btn.am{background:var(--amber);border-color:var(--amber);color:#fff}
.btn.d{color:var(--ng);border-color:#E7B5AF}
.btn.s{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.flt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.flt select,.flt input{border:1px solid #C5CCD6;border-radius:6px;padding:7px 9px;background:#fff;max-width:100%}
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{background:#EEF1F5;color:#344054;font-weight:600;padding:8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid #EDF0F3;vertical-align:top}
table.t tr.cl{cursor:pointer}table.t tr.cl:hover td{background:#F7F9FC}
.c{text-align:center}.rt{text-align:right}.nw{white-space:nowrap}
.ell{max-width:330px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:#E3F4EA;color:var(--ok)}.tag.w{background:#FDF1DC;color:var(--warn)}.tag.ng{background:#FBE4E1;color:var(--ng)}.tag.n{background:#EEF1F5;color:#475467}.tag.b{background:#E4ECF7;color:var(--steel)}
.muted{color:var(--sub);font-size:12px}
/* form */
.fg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 14px}
.f label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid #C5CCD6;border-radius:6px;padding:8px 9px;background:#fff}
.f textarea{min-height:92px;resize:vertical;line-height:1.5}
.f input:disabled,.f select:disabled,.f textarea:disabled,.ck input:disabled,.ck textarea:disabled{background:#F4F6F8;color:#344054}
.span2{grid-column:span 2}.span4{grid-column:1/-1}
.req::after{content:' *';color:var(--ng)}
table.ck{width:100%;border-collapse:collapse}
table.ck th{background:#EEF1F5;font-size:12px;padding:8px;border:1px solid var(--line)}
table.ck td{border:1px solid var(--line);padding:6px 8px;vertical-align:middle}
table.ck td.g{background:#F7F9FC;font-weight:600;text-align:center;width:80px}
table.ck textarea{width:100%;border:1px solid #D0D5DD;border-radius:5px;padding:6px;min-height:44px;resize:vertical;line-height:1.4}
table.ck input.sc{width:62px;text-align:center;border:1px solid #C5CCD6;border-radius:5px;padding:7px 4px;font-weight:700;font-size:15px}
table.ck input.sc.bad{border-color:var(--ng);background:#FFF3F1}
.tot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:12px;padding:12px 14px;background:#F7F9FC;border:1px solid var(--line);border-radius:var(--r)}
.tot .big{font-size:26px;font-weight:800}
.readout{font-variant-numeric:tabular-nums}
.appr{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.appr .box{border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center;background:#FBFCFD}
.appr .box .h{font-size:12px;color:var(--sub)}.appr .box .n{font-weight:700;font-size:15px;margin:6px 0 2px;min-height:20px}
.appr .box .d{font-size:12px;color:var(--sub);min-height:16px}
.bar{height:10px;background:#EDF0F3;border-radius:5px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--steel)}
.bar>i.lo{background:var(--amber)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stick{position:sticky;bottom:0;background:#fffe;backdrop-filter:blur(4px);border-top:1px solid var(--line);padding:10px 16px;margin:0 -16px -16px;display:flex;gap:8px;flex-wrap:wrap;border-radius:0 0 var(--r) var(--r)}
/* cards (mobile) */
.cards{display:none}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card .t1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .pn{font-weight:700;font-size:15px}
.card .ln{font-size:13px;color:#344054;margin-top:6px;line-height:1.45}
.card .ft{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.cki{border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px;background:#fff}
.cki .q{font-size:13px;font-weight:600;margin-bottom:6px}
.cki .row{display:flex;gap:8px;align-items:center;margin-top:6px}
/* modal */
.mb{position:fixed;inset:0;background:#0008;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
.mb.open{display:flex}
.md{background:#fff;border-radius:10px;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px}
.md h3{margin:0 0 12px}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pinpad button{padding:14px;font-size:18px;border:1px solid #C5CCD6;border-radius:8px;background:#fff;cursor:pointer}
.pindisp{font-size:28px;letter-spacing:10px;text-align:center;border:1px solid #C5CCD6;border-radius:8px;padding:8px;min-height:52px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1D2530;color:#fff;padding:10px 18px;border-radius:8px;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.hint{background:#FFF8EC;border:1px solid #F2D6A8;color:#7A4B0C;border-radius:6px;padding:8px 10px;font-size:13px;margin-bottom:10px}
#print{display:none}
.m-only{display:none}
.evg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.evc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff;font-size:12px}
.evt{display:grid;place-items:center;height:118px;background:#EEF1F5;text-decoration:none}
.evt img{width:100%;height:118px;object-fit:cover;display:block}
.evf{font-size:20px;font-weight:800;color:var(--steel)}
.evm{padding:7px 8px;display:grid;gap:3px}.evm .ell{max-width:100%}
.actr{display:grid;grid-template-columns:1fr 110px 150px 190px;gap:8px;align-items:start;padding:9px 0;border-bottom:1px solid #EDF0F3}
.actr input{width:100%;border:1px solid #C5CCD6;border-radius:6px;padding:6px 8px}
.actr .dn{font-size:12px;color:var(--ok)}
.monr{display:grid;grid-template-columns:70px 120px 110px 1fr 200px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #EDF0F3}
.subh{font-size:13px;font-weight:700;margin:14px 0 6px;color:#344054}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.fg{grid-template-columns:repeat(2,1fr)}}
@media (max-width:700px){
 .m-only{display:inline-block}
 .actr{grid-template-columns:1fr 1fr}.actr>*:first-child{grid-column:1/-1}.actr>*:last-child{grid-column:1/-1}
 .monr{grid-template-columns:60px 1fr;row-gap:4px}.monr>*:nth-child(n+4){grid-column:1/-1}
 .evg{grid-template-columns:repeat(2,1fr)}
 .menu,.who .nm,.logo small{display:none}.hb{display:block}
 main{padding:10px}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .fg{grid-template-columns:1fr}.span2{grid-column:auto}
 .tbl-pc{display:none}.cards{display:block}
 .grid2{grid-template-columns:1fr}
 .appr{grid-template-columns:repeat(3,1fr)}
 .ph h2{font-size:17px}
 .stick{margin:0 -10px -16px}
 .panel{padding:12px}
}
/* ===== print ===== */
@page{size:A4 landscape;margin:9mm}
@media print{
 body{background:#fff}
 .top,.nav,.shade,main,.mb,.toast{display:none!important}
 #print{display:block}
 .pg{page-break-after:always;break-after:page}
 .pg:last-child{page-break-after:auto;break-after:auto}
}
.pf{width:100%;border-collapse:collapse;font-size:11.5px;table-layout:fixed;color:#000;font-family:'Malgun Gothic',Pretendard,sans-serif}
.pf td{border:1px solid #000;padding:4px 6px;vertical-align:middle;line-height:1.35}
.pf .lb{background:#E9EDF2;text-align:center;font-weight:700}
.pf .ttl{font-size:21px;font-weight:800;text-align:center;letter-spacing:2px}
.pf .pre{white-space:pre-wrap}
.pf .nb{border:0}
.pfno{display:flex;justify-content:space-between;font-size:10px;margin-top:4px;color:#000;font-family:'Malgun Gothic',sans-serif}
</style>
</head>

const addDays=(s,n)=>{if(!s)return'';const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function normDate(v){
  if(v==null||v==='')return'';
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*864e5));return d.toISOString().slice(0,10)}
  if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  const m=String(v).trim().match(/^(\d{2,4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/);
  if(!m)return'';let y=+m[1];if(y<100)y+=2000;
  return y+'-'+String(+m[2]).padStart(2,'0')+'-'+String(+m[3]).padStart(2,'0');
}

function mergeRec(o,r){

    return Object.values(mm).filter(it=>!x.xdel[it.id]).sort((a,b)=>(a.at||'').localeCompare(b.at||''))};
  x.files=un(l.files,w.files);x.acts=un(l.acts,w.acts);
  x.mons={...(l.mons||{})};for(const k in (w.mons||{}))if(!x.mons[k]||(w.mons[k].at||'')>=(x.mons[k].at||''))x.mons[k]=w.mons[k];

  const m={};for(const r0 of [...(a.recs||[]),...(b.recs||[])]){const r=ensureRec(r0);const o=m[r.id];m[r.id]=o?mergeRec(o,r):r}
  const recs=Object.values(m).filter(r=>!del[r.id]);
  const ca=a.cfg||DEF_CFG,cb=b.cfg||DEF_CFG;
  const cfg=((cb.ua||'')>(ca.ua||''))?cb:ca;
  return {recs,del,cfg:{...DEF_CFG,...cfg}};
}

/* ---------- 고객사 명칭 변경 규칙 ---------- */
// SKF ATC → SBC : 2025년 발생분부터 적용(since 비우면 전체 기간 + 고객사 목록에서도 제거)
const CUST_RENAME=[{from:'SKF ATC',to:'SBC',since:'2025-01-01'}];
const cnorm=c=>String(c||'').replace(/\s/g,'').toUpperCase();
function custRule(r){
  for(const x of CUST_RENAME){if(cnorm(r.cust)===cnorm(x.from)&&(r.occDate||'')>=x.since){r.cust=x.to;return true}}
  return false;
}
function migrate(st){
  let ch=false;
  for(const r of st.recs)if(custRule(r)){r.ua=nowISO();ch=true}
  const cs=st.cfg.custs||[];
  for(const x of CUST_RENAME){
    if(!cs.includes(x.to)){cs.unshift(x.to);st.cfg.custs=cs;st.cfg.ua=nowISO();ch=true}
    const k=cs.findIndex(c=>cnorm(c)===cnorm(x.from));
    if(!x.since&&k>=0){cs.splice(k,1);st.cfg.custs=cs;st.cfg.ua=nowISO();ch=true}
  }
  return ch;
}

/* ---------- server ---------- */
const H={apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'};
function setDot(c,t){const d=$('#dot');d.className='dot '+c;d.title=t||''}
async function pullServer(){
  const r=await fetch(SB_URL+'/rest/v1/kv_store?select=value,updated_at&key=eq.'+KV,{headers:H,cache:'no-store'});
  if(!r.ok)throw new Error('pull '+r.status);
  const j=await r.json();return j.length?j[0].value:null;
}
async function putServer(v){
  const r=await fetch(SB_URL+'/rest/v1/kv_store?on_conflict=key',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:KV,value:v,updated_at:nowISO()})});
  if(!r.ok)throw new Error('push '+r.status);
}
let pushT=null,syncing=false,dirty=false;
function schedulePush(){dirty=true;clearTimeout(pushT);pushT=setTimeout(sync,700)}
async function sync(first){
  if(syncing){dirty=true;return}
  syncing=true;setDot('busy','동기화 중…');
  try{
    const sv=await pullServer();
    const before=JSON.stringify(S);
    let merged;
    if(!sv){merged=S.recs.length?S:{...S,recs:seedRecs()}}
    else if(S._fresh){merged=mergeState({recs:[],del:{},cfg:DEF_CFG},sv)} // 새 기기: 서버 정본 채택
    else merged=mergeState(S,sv);
    delete merged._fresh;
    if(migrate(merged))dirty=true;
    S=merged;saveLocal();
    const needPush=!sv||dirty||JSON.stringify(sv)!==JSON.stringify(S);
    dirty=false;
    if(needPush)await putServer(S);
    setDot('ok','동기화 완료 '+new Date().toLocaleTimeString('ko-KR')+' · '+S.recs.length+'건');
    if(JSON.stringify(S)!==before||first)render(true);
  }catch(e){console.warn(e);setDot('err','동기화 실패 — 로컬 저장됨 ('+e.message+')');}
  syncing=false;
  if(dirty){dirty=false;schedulePush()}
}

/* ---------- derived ---------- */
function total(r){return (r.scores||[]).reduce((a,b)=>a+(+b||0),0)}
function scored(r){return (r.scores||[]).some(v=>v!==null&&v!==''&&v!==undefined)}
function complete(r){return (r.scores||[]).length===9&&r.scores.every(v=>v!==null&&v!==''&&v!==undefined)}
function judge(r){if(!complete(r))return null;const t=total(r);return t>=80?'A':t>=60?'R1':'R2'}
const JT={A:['Accept','ok'],R1:['Reject·보완','w'],R2:['Reject·재수립','ng']};
function status(r){
  if(!complete(r))return 'wait';
  if(r.appr&&r.appr.approve)return 'done';
  if(r.legacy&&!(r.appr&&r.appr.review))return 'done'; // 엑셀 이관분(종이 결재 완료)
  return 'appr';
}
const STT={wait:['평가대기','n'],appr:['결재대기','b'],done:['승인완료','ok']};
const sttOf=r=>r.legacy&&status(r)==='done'&&!(r.appr&&r.appr.approve)?['이관(종이결재)','ok']:STT[status(r)];
function custLabel(r){return (r.cust||'')+(r.site?' '+r.site:'')}
function yearOf(r){return (r.occDate||r.chkDate||'').slice(0,4)}
function recNo(r){
  const y=yearOf(r)||'----';
  const same=S.recs.filter(x=>yearOf(x)===yearOf(r)).sort((a,b)=>(a.occDate||'').localeCompare(b.occDate||'')||(a.created||'').localeCompare(b.created||''));
  const k=same.findIndex(x=>x.id===r.id);
  return k<0?'EV-'+y+'-(신규)':'EV-'+y+'-'+String(k+1).padStart(2,'0');
}
function addMonths(s,n){if(!s)return'';const d=new Date(s+'T00:00:00'),dd=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()<dd)d.setDate(0);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function monList(r){
  if(!r.doneDate)return[];
  return MONS.map(m=>{const due=addMonths(r.doneDate,m);return{m,due,res:(r.mons||{})[m]||null,active:!r.monFrom||due>=r.monFrom}});
}
const monPending=r=>monList(r).filter(x=>x.active&&!x.res);
const monNG=r=>monList(r).some(x=>x.res&&x.res.res==='NG');
const openActs=r=>(r.acts||[]).filter(a=>!a.done);
const hasDoc=r=>(r.files||[]).some(f=>f.cat===DOC_CAT);
const evCover=r=>{const s=new Set((r.files||[]).filter(f=>f.item!==''&&f.item!=null).map(f=>+f.item));return ITEMS.filter((x,i)=>s.has(i)).length};
function monBadges(r){
  const L=monList(r);if(!L.length)return'<span class="muted">-</span>';
  return L.map(x=>{let c='n',t='◷';if(x.res){c=x.res.res==='OK'?'ok':'ng';t=x.res.res==='OK'?'✓':'✗'}else if(!x.active){c='n';t='–'}else if(dday(x.due)<0){c='w';t='!'}
    return`<span class="tag ${c}" title="${x.m}개월 ${x.due}${x.res?' '+(x.res.res==='OK'?'재발 없음':'재발'):(x.active?'':' (이관 전 도래분·대상외)')}" style="padding:1px 6px;font-size:11px">${x.m}M${t}</span>`}).join(' ');
}

/* ---------- list ---------- */
function filtered(){
  const q=FILT.q.trim().toLowerCase();
  return S.recs.filter(r=>{
    if(FILT.y&&yearOf(r)!==FILT.y)return false;
    if(FILT.c&&r.cust!==FILT.c)return false;
    if(FILT.s){if(['wait','appr','done'].includes(FILT.s)){if(status(r)!==FILT.s)return false}
      else if(FILT.s==='act'){if(!openActs(r).length)return false}
      else if(FILT.s==='mon'){if(!monPending(r).some(m=>dday(m.due)<=30))return false}
      else if(FILT.s==='ng'){if(!monNG(r))return false}
      else if(FILT.s==='noev'){if((r.files||[]).length)return false}
      else if(FILT.s==='nodoc'){if(hasDoc(r))return false}
      else if(judge(r)!==FILT.s)return false}
    if(q&&![r.part,r.car,r.cause,r.action,r.cust,r.site,r.summary].join(' ').toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>(b.occDate||'').localeCompare(a.occDate||''));
}
function postBadges(r){
  const oa=openActs(r).length,nf=(r.files||[]).length;
  return `${monBadges(r)} ${oa?`<span class="tag w" style="padding:1px 6px;font-size:11px">要 ${oa}</span>`:''} <span class="tag ${nf?'b':'n'}" style="padding:1px 6px;font-size:11px" title="증빙자료">📎${nf}</span>`;
}
function listTable(rows){
  if(!rows.length)return'<div class="muted" style="padding:14px 0">해당 자료가 없습니다.</div>';
  const pc=`<div class="tw tbl-pc"><table class="t"><tr><th>관리번호</th><th>발생일</th><th>고객사</th><th>차종</th><th>품명</th><th>불량내용/원인</th><th>대책완료</th><th>점검일</th><th class="c">점수</th><th class="c">판정</th><th class="c">상태</th><th>사후관리</th></tr>${rows.map(r=>{const j=judge(r),st=sttOf(r);return`<tr class="cl" onclick="go('form','${r.id}')"><td class="nw muted">${recNo(r)}${r.round>1?' <span class="tag w">재'+(r.round-1)+'</span>':''}</td><td class="nw">${fmtD(r.occDate)}</td><td class="nw">${esc(custLabel(r))}</td><td class="nw">${esc(r.car)}</td><td class="nw"><b>${esc(r.part).replace(/\n/g,'<br>')}</b></td><td><div class="ell">${esc((r.cause||'').split('\n')[0])}</div></td><td class="nw">${fmtD(r.doneDate)}</td><td class="nw">${fmtD(r.chkDate)||'<span class="muted">-</span>'}</td><td class="c readout"><b>${complete(r)?total(r):'-'}</b></td><td class="c">${j?`<span class="tag ${JT[j][1]}">${JT[j][0]}</span>`:'-'}</td><td class="c"><span class="tag ${st[1]}">${st[0]}</span></td><td class="nw">${postBadges(r)}</td></tr>`}).join('')}</table></div>`;
  const mc=`<div class="cards">${rows.map(r=>{const j=judge(r),st=sttOf(r);return`<div class="card" onclick="go('form','${r.id}')"><div class="t1"><div><div class="pn">${esc(r.part).replace(/\n/g,' / ')}</div><div class="muted">${recNo(r)} · ${esc(custLabel(r))} · ${esc(r.car)}</div></div><div class="rt"><div class="readout" style="font-size:20px;font-weight:800">${complete(r)?total(r):'-'}</div></div></div><div class="ln">${esc((r.cause||'').split('\n')[0])}</div><div class="ft"><span class="tag ${st[1]}">${st[0]}</span>${j?`<span class="tag ${JT[j][1]}">${JT[j][0]}</span>`:''}<span class="muted">발생 ${fmtD(r.occDate)} · 점검 ${fmtD(r.chkDate)||'-'}</span></div><div class="ft">${postBadges(r)}</div></div>`}).join('')}</div>`;
  return pc+mc;
}

function bindForm(){
  const m=$('#main');
  m.addEventListener('input',e=>{
    const t=e.target;
    if(t.dataset.sc!==undefined){
      const i=+t.dataset.sc;let v=t.value.replace(/[^\d]/g,'');
      t.value=v;
      document.querySelectorAll(`[data-sc="${i}"]`).forEach(x=>{if(x!==t)x.value=v});
      t.classList.toggle('bad',v!==''&&+v>MAXS[i]);
      CUR.scores[i]=v===''?null:+v;updTot();
    }else if(t.dataset.op!==undefined){const i=+t.dataset.op;CUR.opinions[i]=t.value;document.querySelectorAll(`[data-op="${i}"]`).forEach(x=>{if(x!==t)x.value=t.value})}
    else if(t.dataset.sum){CUR.summary=t.value;document.querySelectorAll('[data-sum]').forEach(x=>{if(x!==t)x.value=t.value})}
    else if(t.id==='f_doneDate'){const d=$('#f_dueDate');if(d&&!d.value&&t.value)d.value=addDays(t.value,+S.cfg.dueDays||30)}
  });
  m.addEventListener('change',e=>{if(e.target.id==='f_doneDate'){const d=$('#f_dueDate');if(d&&!d.value&&e.target.value)d.value=addDays(e.target.value,+S.cfg.dueDays||30)}});
  renderPost();renderAppr();
  if(!CUR._new)loadRecur().then(()=>{if(VIEW==='form'){renderMons();renderRcr()}}).catch(e=>{const el=$('#rcr');if(el)el.innerHTML='<div class="muted" style="margin-top:10px">재발 확인 자료를 불러오지 못했습니다 ('+esc(e.message)+')</div>'});
}
function fullSc(i){CUR.scores[i]=MAXS[i];document.querySelectorAll(`[data-sc="${i}"]`).forEach(x=>{x.value=MAXS[i];x.classList.remove('bad')});updTot()}
function updTot(){
  const r=CUR,t=total(r),j=judge(r),n=r.scores.filter(v=>v!==null&&v!=='').length;
  const over=r.scores.some((v,i)=>v!==null&&+v>MAXS[i]);
  const chk=(k,l)=>`<span style="margin-right:12px">${j===k?'■':'□'} ${l}</span>`;
  $('#tot').innerHTML=`<div><div class="muted">합계</div><div class="big readout">${t}<span class="muted" style="font-size:14px"> / 100</span></div></div>
  <div>${j?`<span class="tag ${JT[j][1]}" style="font-size:15px;padding:5px 14px">${JT[j][0]}</span>`:`<span class="tag n">입력 ${n}/9</span>`}</div>
  <div class="muted" style="flex:1;min-width:240px">${chk('A','Accept (80점 이상)')}${chk('R1','Reject (60점 이상 : 기존대책보완)')}${chk('R2','Reject (60점 미만 : 대책재수립)')}${over?'<div style="color:var(--ng);margin-top:4px">⚠ 배점을 초과한 평점이 있습니다.</div>':''}<div style="margin-top:4px">📎 증빙 연결 항목 <b>${evCover(r)}</b>/${ITEMS.length} · 첨부 ${(r.files||[]).length}건${openActs(r).length?` · <span style="color:var(--warn)">要 미완료 ${openActs(r).length}건</span>`:''}</div></div>`;
}
function renderAppr(){
  const r=CUR,a=r.appr||{};
  const box=(h,n,d,btn)=>`<div class="box"><div class="h">${h}</div><div class="n">${esc(n||'')}</div><div class="d">${d?fmtD(d):''}</div>${btn||''}</div>`;
  const saved=!r._new;
  const rv=a.review?`${isAppr()?'<button class="btn s" onclick="apprAct(\'review\',0)">취소</button>':''}`:(isAppr()&&saved&&complete(r)?'<button class="btn s p" onclick="apprAct(\'review\',1)">검토</button>':'');
  const ap=a.approve?`${isAppr()?'<button class="btn s" onclick="apprAct(\'approve\',0)">취소</button>':''}`:(isAppr()&&saved&&a.review?'<button class="btn s p" onclick="apprAct(\'approve\',1)">승인</button>':'');
  $('#appr').innerHTML=box('작성',r.inspector,r.chkDate)+box('검토',a.review&&a.review.n,a.review&&a.review.d,rv)+box('승인',a.approve&&a.approve.n,a.approve&&a.approve.d,ap)
   +(!isAppr()?'<div class="muted span4" style="grid-column:1/-1">검토·승인은 승인자 PIN으로 로그인해야 가능합니다. 평가 점수가 모두 입력·저장된 건만 결재할 수 있습니다.</div>':'');
}
function collect(noValidate){
  const r=CUR,g=k=>{const e=$('#f_'+k);return e?e.value.trim():r[k]};
  for(const k of ['cust','site','car','part','occDate','qty','doneDate','dueDate','cause','action','chkDate','inspector'])r[k]=g(k);
  return r;
}
function sig(r){return JSON.stringify([r.cust,r.site,r.car,r.part,r.occDate,r.qty,r.cause,r.action,r.doneDate,r.chkDate,r.inspector,r.scores,r.opinions,r.summary])}
function saveForm(){
  const r=collect();
  if(!r.part||!r.occDate||!r.cust){toast('고객사·품명·발생일은 필수입니다');return}
  if(custRule(r)){const e=$('#f_cust');if(e){if(![...e.options].some(o=>o.value===r.cust))e.add(new Option(r.cust));e.value=r.cust}toast('2026년 이후 발생분은 SBC로 저장됩니다')}
  if(r.scores.some((v,i)=>v!==null&&+v>MAXS[i])){toast('배점을 초과한 평점이 있습니다');return}
  if(scored(r)&&!complete(r)&&!confirm('평점이 일부만 입력되었습니다. 평가대기 상태로 저장할까요?'))return;
  if(complete(r)&&!r.chkDate)r.chkDate=today();
  const old=S.recs.find(x=>x.id===r.id);
  if(old&&(old.appr.review||old.appr.approve)&&sig(old)!==sig(r)){
    if(!confirm('결재된 내용이 변경되었습니다. 저장하면 검토·승인이 초기화됩니다. 계속할까요?'))return;
    r.appr={review:null,approve:null};
  }
  if(old&&old.legacy&&sig(old)!==sig(r))delete r.legacy;
  if(!r.dueDate&&r.doneDate)r.dueDate=addDays(r.doneDate,+S.cfg.dueDays||30);
  delete r._new;r.ua=nowISO();r.editor=USER?USER.n:'';
  const i=S.recs.findIndex(x=>x.id===r.id);if(i>=0)S.recs[i]=JSON.parse(JSON.stringify(r));else S.recs.push(JSON.parse(JSON.stringify(r)));
  saveLocal();schedulePush();toast('저장되었습니다');
  CUR=JSON.parse(JSON.stringify(r));render();
}
function apprAct(k,on){
  if(!isAppr())return;
  const r=S.recs.find(x=>x.id===CUR.id);if(!r)return;
  if(sig(r)!==sig(collect(true))){toast('변경 내용을 먼저 저장하세요');return}
  r.appr=r.appr||{};
  if(on)r.appr[k]={n:USER.n,d:today()};else{r.appr[k]=null;if(k==='review')r.appr.approve=null}
  r.ua=nowISO();saveLocal();schedulePush();
  CUR=JSON.parse(JSON.stringify(r));render();toast(on?(k==='review'?'검토 완료':'승인 완료'):'결재 취소');
}
function reEval(skip){
  const o=S.recs.find(x=>x.id===CUR.id);if(!o)return;
  if(!skip&&!confirm('보완/재수립 대책에 대해 재평가 건을 새로 등록합니다.'))return;
  const n=newRec();
  Object.assign(n,{cust:o.cust,site:o.site,car:o.car,part:o.part,occDate:o.occDate,qty:o.qty,cause:o.cause,action:o.action+'\n[보완] ',round:(o.round||1)+1,parent:o.id,src:'재평가('+recNo(o)+')'});
  CUR=n;VIEW='form';render();window.scrollTo(0,0);
}
function delRec(){
  if(!isAppr())return;
  if(!confirm('이 검증 건을 삭제할까요? (모든 기기에서 삭제됩니다)'))return;
  S.del[CUR.id]=Date.now();S.recs=S.recs.filter(r=>r.id!==CUR.id);saveLocal();schedulePush();toast('삭제되었습니다');go('list');
}


/* ---------- 사후관리: 증빙·후속조치·재발 모니터링 ---------- */
const srec=()=>S.recs.find(x=>x.id===CUR.id);
const pubUrl=p=>SB_URL+'/storage/v1/object/public/'+BUCKET+'/'+String(p).split('/').map(encodeURIComponent).join('/');
function patch(fn,msg){
  if(!USER){login();return false}
  const r=srec();if(!r||CUR._new){toast('먼저 [저장]한 뒤 사용할 수 있습니다');return false}
  ensureRec(r);fn(r);
  for(const k of ['files','acts','mons','xdel'])CUR[k]=JSON.parse(JSON.stringify(r[k]));
  saveLocal();schedulePush();if(msg)toast(msg);renderPost();return true;
}

function shrink(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('압축실패')),'image/jpeg',0.82)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('이미지 해석 불가'))};im.src=u})}
// Storage 업로드 후 증빙 메타 반환(사진은 압축)
async function putFile(r,f,cat,item){
  let blob=f,type=f.type||'application/octet-stream',ext=((f.name.split('.').pop()||'bin').toLowerCase()).replace(/[^a-z0-9]/g,'')||'bin';
  if(/^image\//.test(type)&&!/gif|svg/.test(type)){try{const b=await shrink(f);if(b.size<f.size){blob=b;type='image/jpeg';ext='jpg'}}catch(e){}}
  const id='F'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),path=`${FOLDER}/${r.id}/${id}.${ext}`;
  const res=await fetch(`${SB_URL}/storage/v1/object/${BUCKET}/${path}`,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':type,'x-upsert':'true'},body:blob});
  if(!res.ok)throw new Error(res.status+' '+(await res.text()).slice(0,80));
  return {id,name:f.name,cat,item,path,type,size:blob.size,osize:f.size,by:USER.n,at:nowISO()};
}
async function upFiles(list){

  if(!USER){login();return}
  const cat=$('#ev_cat').value,itv=$('#ev_item').value,item=itv===''?'':+itv,fl=[...list];let ok=0;
  for(let i=0;i<fl.length;i++){

    if(f.size>20e6){toast(f.name+' : 20MB 초과');continue}

  }

  if(ok)toast(`증빙 ${ok}건 첨부`);
}

function splitReq(t){

}
function extractActs(){

  const add=L.filter(t=>!have.has(t.replace(/\s/g,'')));

const pcore=s=>String(s||'').toUpperCase().replace(/\s/g,'').replace(/^(IW\/OW-|IW-|OW-)/,'').replace(/-[1-3]$/,'');
function pmatch(part,pn){const b=pcore(pn);if(b.length<5)return false;return String(part||'').split(/[\n,]+/).map(pcore).filter(a=>a.length>=5).some(a=>a===b||a.startsWith(b)||b.startsWith(a))}
function recurHits(r){
  if(!RCR||!r.doneDate)return null;
  const txt=(r.cause||'')+' '+(r.action||'');
  const led=RCR.led.filter(x=>x.led_date>r.doneDate&&pmatch(r.part,x.pn)).map(x=>{
    const ty=[...String(x.note||'').matchAll(/([가-힣A-Za-z0-9]+)\s*:\s*(\d+)/g)].map(m=>[m[1],+m[2]]);
    return{...x,ty,sus:ty.filter(([t])=>txt.includes(t))}});
  const sdr=RCR.sdr.filter(x=>(x.occur_date||'')>r.doneDate&&pmatch(r.part,x.part_no));
  return{led,sdr};
}

  const H2=recurHits(r);if(!H2)return null;const i=MONS.indexOf(m),from=i?addMonths(r.doneDate,MONS[i-1]):r.doneDate,to=addMonths(r.doneDate,m);
  return{sus:H2.led.filter(x=>x.led_date>from&&x.led_date<=to&&x.sus.length),all:H2.led.filter(x=>x.led_date>from&&x.led_date<=to),sdr:H2.sdr.filter(x=>x.occur_date>from&&x.occur_date<=to)};
}

/* ---------- 대책서 일괄 첨부 (공유폴더) ---------- */
const BULK_ACC='.pdf,.xlsx,.xls,.xlsm,.docx,.doc,.pptx,.ppt,.hwp,.hwpx,.jpg,.jpeg,.png';
const BULK_EXT=/\.(pdf|xlsx|xls|xlsm|docx|doc|pptx|ppt|hwp|hwpx|jpe?g|png)$/i;
let BULK=null; // {rows:[{f,path,img,id,how,cands,st,msg}],busy,none,img}
const pnorm=s=>String(s||'').toUpperCase().replace(/[^0-9A-Z]/g,'');
function pathDates(p){
  const out=[],add=(y,m,d)=>{y=+y;if(y<100)y+=2000;m=+m;d=+d;if(y>=2015&&y<=2040&&m>=1&&m<=12&&d>=1&&d<=31)out.push(y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0'))};
  let m;const a=/(?<!\d)(20\d{2}|\d{2})[.\-_ ](\d{1,2})[.\-_ ](\d{1,2})(?!\d)/g,b=/(?<!\d)(20\d{2}|\d{2})(\d{2})(\d{2})(?!\d)/g;
  while((m=a.exec(p)))add(m[1],m[2],m[3]);while((m=b.exec(p)))add(m[1],m[2],m[3]);
  return out;
}
const dgap=(a,b)=>a&&b?Math.abs((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/864e5):Infinity;
// 경로 속 가장 긴 품번이 일치하는 건 → 여러 건이면 경로 날짜, 없으면 파일 수정일로 선택
const nearest=(c,ds,lim,gap)=>{
  const sc=c.map(r=>({r,g:Math.min(...ds.map(d=>Math.min(dgap(d,r.occDate),dgap(d,r.doneDate))))})).sort((x,y)=>x.g-y.g);
  return sc[0].g<=lim&&(sc.length<2||sc[1].g-sc[0].g>=gap)?sc[0].r:null;
};
// 품번 일치 길이. core=true 이면 앞 영문(IW-BDA- 등)을 뗀 번호(1106CB)만으로 찾음
function partHit(path,part,core){
  const P=pnorm(path),U=path.toUpperCase();let L=0;
  for(const t of String(part||'').split(/[\n,\/]+/)){
    const k=pnorm(t);
    if(!core){if(k.length>=5&&P.includes(k))L=Math.max(L,k.length);continue}
    const c=k.replace(/^[A-Z]+/,'');if(c===k||c.length<4)continue;
    if(new RegExp('(?<![0-9])'+c+'(?![0-9])').test(U))L=Math.max(L,c.length);
  }
  return L;
}
function bulkMatch(path,mt){
  const ds=pathDates(path);let best=0,c=[],core=false;
  const scan=cr=>{for(const r of S.recs){const L=partHit(path,r.part,cr);if(!L)continue;if(L>best){best=L;c=[r]}else if(L===best)c.push(r)}};
  scan(false);if(!c.length){core=true;scan(true)}
  if(!c.length)return{id:'',how:'none',cands:[]};
  const cands=c.map(r=>r.id);
  if(c.length===1)return{id:c[0].id,how:core?'core':'part',cands};
  let r;
  if(ds.length&&(r=nearest(c,ds,45,7)))return{id:r.id,how:'date',cands};
  if(!ds.length&&mt&&(r=nearest(c,[mt],30,14)))return{id:r.id,how:'mtime',cands};
  return{id:'',how:'multi',cands};
}
const isDup=(r,f)=>!!r&&(r.files||[]).some(x=>x.name===f.name&&(x.osize??x.size)===f.size);
function bulkRead(list){
  const all=[...list];
  if(!USER){login(()=>{go('data');bulkRead(all)});return}
  const fl=all.filter(f=>!/^(~\$|\.)/.test(f.name)&&!/^thumbs\.db$/i.test(f.name)&&BULK_EXT.test(f.name));
  if(!fl.length){BULK=null;$('#bulkv').innerHTML=`<div class="hint">선택한 파일 ${all.length}개 중 첨부할 수 있는 형식(PDF·엑셀·워드·PPT·한글·사진)이 없습니다.</div>`;$('#bulkp').scrollIntoView({behavior:'smooth'});return}
  const rows=fl.map(f=>{const path=f.webkitRelativePath||f.name,m=bulkMatch(path,f.lastModified?locD(f.lastModified):'');return{f,path,img:/\.(jpe?g|png)$/i.test(f.name),...m,st:f.size>20e6?'big':'',msg:''}});
  rows.forEach(x=>bulkChk(x));
  const ord={multi:0,mtime:1,core:2,none:3,date:4,part:5};rows.sort((a,b)=>ord[a.how]-ord[b.how]||a.path.localeCompare(b.path));
  // 연결된 파일이 하나도 없으면 미연결 목록을 바로 보여줘 직접 고를 수 있게 함
  const hit=rows.some(x=>x.how!=='none'&&!x.img);
  BULK={rows,busy:false,none:!hit,img:false,skip:all.length-fl.length};$('#bulkv').innerHTML=bulkHtml();$('#bulkp').scrollIntoView({behavior:'smooth'});
}
function bulkChk(x){if(x.st==='big'||x.st==='ok')return;x.st=isDup(S.recs.find(r=>r.id===x.id),x.f)?'dup':''}
const bulkOn=x=>x.id&&!x.st&&(BULK.img||!x.img);

  const STX={big:['20MB 초과','ng'],dup:['이미 첨부','n'],ok:['완료','ok'],err:['실패','ng'],up:['업로드 중','b']};
  const go_=R.filter(bulkOn).length,cnt=k=>R.filter(x=>x.how===k).length,ni=R.filter(x=>x.img).length;
  const V=R.filter(x=>(BULK.none||x.how!=='none')&&(BULK.img||!x.img));
  let h=`${!R.some(x=>x.how!=='none')?`<div class="hint">파일명·폴더명에서 등록된 품번을 찾지 못했습니다. 아래 목록에서 파일마다 연결할 검증 건을 직접 고른 뒤 업로드하세요.</div>`:''}
   <div class="flt"><span class="muted">파일 ${R.length}개${BULK.skip?` (형식 제외 ${BULK.skip}개)`:''} · 자동연결 ${cnt('part')+cnt('date')} · <span style="color:var(--warn)">확인 필요 ${cnt('multi')+cnt('mtime')+cnt('core')}</span> · 미연결 ${cnt('none')}</span>
   <label class="muted"><input type="checkbox" ${BULK.none?'checked':''} onchange="BULK.none=this.checked;$('#bulkv').innerHTML=bulkHtml()"> 미연결 파일 보기</label>
   <label class="muted"><input type="checkbox" ${BULK.img?'checked':''} ${BULK.busy?'disabled':''} onchange="BULK.img=this.checked;$('#bulkv').innerHTML=bulkHtml()"> 사진(jpg·png) ${ni}개 포함</label><span class="sp"></span>
   <button class="btn p" ${go_&&!BULK.busy?'':'disabled'} onclick="bulkUp()">⬆ ${go_}건 업로드</button><button class="btn" ${BULK.busy?'disabled':''} onclick="BULK=null;$('#bulkv').innerHTML=''">닫기</button></div>
   <div class="muted" id="bulk_st" style="margin-bottom:6px"></div>
   <div class="tw"><table class="t"><tr><th>파일 (폴더 경로)</th><th>연결할 검증 건</th><th class="c">연결</th><th class="c">상태</th></tr>`;
  if(!V.length)h+=`<tr><td colspan="4" class="muted" style="text-align:center">표시할 파일이 없습니다 (품번이 들어있는 파일 없음)</td></tr>`;
  h+=V.map(x=>{const i=R.indexOf(x),cs=x.cands.map(id=>S.recs.find(r=>r.id===id)).filter(Boolean),rest=recs.filter(r=>!x.cands.includes(r.id));
    const sel=`<select style="max-width:340px" ${BULK.busy||x.st==='ok'?'disabled':''} onchange="bulkSet(${i},this.value)"><option value="">— 첨부 안 함 —</option>${cs.length?`<optgroup label="품번 후보">${cs.map(r=>`<option value="${r.id}" ${r.id===x.id?'selected':''}>${lab(r)}</option>`).join('')}</optgroup>`:''}<optgroup label="전체">${rest.map(r=>`<option value="${r.id}" ${r.id===x.id?'selected':''}>${lab(r)}</option>`).join('')}</optgroup></select>`;
    const st=x.st?STX[x.st]:x.id?['대기','b']:['-','n'];

  return h+'</table></div>';
}
async function bulkUp(){
  if(!USER){login();return}
  const todo=BULK.rows.filter(bulkOn);if(!todo.length)return;
  if(!confirm(`대책서 ${todo.length}건을 '${DOC_CAT}'(으)로 첨부합니다.`))return;
  BULK.busy=true;let ok=0,n=0;
  for(const x of todo){
    n++;x.st='up';$('#bulkv').innerHTML=bulkHtml();$('#bulk_st').textContent=`업로드 중 ${n}/${todo.length} …`;
    const r=S.recs.find(y=>y.id===x.id);
    if(!r){x.st='err';x.msg='검증 건 없음';continue}
    if(isDup(r,x.f)){x.st='dup';continue}
    try{const m=await putFile(r,x.f,DOC_CAT,'');ensureRec(r).files.push(m);saveLocal();schedulePush();x.st='ok';ok++}
    catch(e){console.warn(e);x.st='err';x.msg=e.message}
  }
  BULK.busy=false;$('#bulkv').innerHTML=bulkHtml();
  const fail=todo.filter(x=>x.st==='err').length;
  $('#bulk_st').textContent=`${ok}건 첨부 완료`+(fail?` · 실패 ${fail}건 (상태에 마우스를 올리면 사유 표시)`:'');
  toast(`대책서 ${ok}건 첨부`);
}

  <div class="panel" id="bulkp" style="margin-top:14px"><h3>📁 유출불량 대책서 일괄 첨부 <span class="muted">서버 공유폴더 → 검증 건 자동 연결</span></h3>
   <div class="muted" style="margin-bottom:10px;line-height:1.7">· [폴더 선택] 창에서 서버 공유폴더(네트워크 드라이브 또는 <code>\\\\서버\\폴더</code> 주소 입력)의 대책서 폴더를 고르면 하위 폴더까지 모두 읽습니다.<br>
    · 폴더명·파일명에 들어있는 <b>품번</b>으로 건을 찾고, 같은 품번이 여러 건이면 <b>날짜</b>(예: 20250514, 2025-05-14, 250514)로 발생일·대책완료일과 가장 가까운 건을 고릅니다.<br>
    · 경로에 날짜가 없으면 파일 수정일로 추정하고 '수정일 추정'으로 표시합니다. 이때는 연결이 맞는지 꼭 확인하세요.<br>
    · 고객사 폴더가 여럿인 상위 폴더(예: 불량대응\\유출불량)를 통째로 골라도 됩니다. 품번이 없는 파일(양식 등)은 자동으로 빠지고, 사진은 기본 제외입니다.<br>
    · 이미 같은 이름·크기로 첨부된 파일은 건너뜁니다. 업로드 전 연결 결과를 확인·수정할 수 있습니다.</div>
   ${canEdit()?`<div class="flt"><label class="btn p">📁 폴더 선택<input type="file" webkitdirectory directory multiple hidden onchange="bulkRead(this.files);this.value=''"></label>
    <label class="btn">📄 파일 선택<input type="file" multiple hidden accept="${BULK_ACC}" onchange="bulkRead(this.files);this.value=''"></label></div>`:'<div class="hint">로그인 후 사용할 수 있습니다.</div>'}
   <div id="bulkv">${bulkHtml()}</div></div>`;
}
// 양식 엑셀은 검증 건으로 가져오고, 워드·PPT 등 대책서와 양식이 아닌 엑셀은 대책서 일괄 첨부로 넘김
function readXls(files){
  const all=[...files],xl=all.filter(f=>/\.(xlsx?|xlsm)$/i.test(f.name)),out=all.filter(f=>!xl.includes(f));
  const toBulk=()=>{
    const fl=out.filter(f=>BULK_EXT.test(f.name));if(!fl.length)return;
    bulkRead(fl);$('#bulkp').scrollIntoView({behavior:'smooth'});
    toast(`양식 엑셀이 아닌 파일 ${fl.length}개는 대책서 첨부로 넘겼습니다`);
    if(!IMP.length)$('#impv').innerHTML=`<div class="hint">가져올 ${FORM_NO} 양식 시트가 없어 대책서 일괄 첨부로 넘겼습니다. 아래에서 연결할 건을 확인하세요.</div>`;
  };
  IMP=[];
  if(!xl.length){toBulk();return}
  if(!window.XLSX){toast('엑셀 라이브러리를 불러오지 못했습니다(네트워크 확인)');return}
  let n=xl.length;
  xl.forEach(file=>{
    const fr=new FileReader();
    fr.onload=e=>{
      let got=0;
      try{
        const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        wb.SheetNames.forEach(sn=>{const r=parseSheet(wb.Sheets[sn]);if(r){r.src=file.name+' / '+sn;IMP.push(r);got++}});
      }catch(err){console.warn(err);toast(file.name+' 읽기 실패')}
      if(!got)out.push(file);
      if(--n===0){showImp();toBulk()}
    };
    fr.readAsArrayBuffer(file);
  });
}
function parseSheet(ws){
  const v=a=>{const c=ws[a];if(!c)return'';let x=c.v;if(typeof x==='string')x=x.replace(/\r\n?/g,'\n').trim();return x};
  const s=a=>{const x=v(a);return typeof x==='number'?String(x):String(x??'')};
  if(!String(v('J2')).includes('유효성')&&!String(v('F16')).includes('항'))return null;
  const part=s('E10');if(!part)return null;
  const num=a=>{const x=v(a);if(x===''||x==null)return null;const n=+x;return isNaN(n)?null:n};
  let cust=s('E12').replace(/\s+/g,' ').trim(),site='';
  const known=[...S.cfg.custs].sort((a,b)=>b.length-a.length).find(c=>cust.replace(/\s/g,'').startsWith(c.replace(/\s/g,'')));
  if(known){site=cust.replace(/\s/g,'').slice(known.replace(/\s/g,'').length);cust=known}
  let qty=v('E13');if(typeof qty==='number')qty=qty+'EA';
  const r=newRec();delete r._new;
  Object.assign(r,{cust,site,car:s('E9'),part,occDate:normDate(v('E11')),qty:String(qty||''),cause:s('J10')+(s('J11')?'\n'+s('J11'):''),action:s('V10'),doneDate:normDate(v('AK11')),
    chkDate:normDate(v('E4')),inspector:s('E6'),scores:[17,18,19,20,21,22,23,24,25].map(i=>num('AI'+i)),opinions:[17,18,19,20,21,22,23,24].map(i=>s('V'+i)),summary:s('E25')});
  r.dueDate=addDays(r.doneDate,+S.cfg.dueDays||30);
  r.monFrom=today();
  custRule(r);
  return r;
}
function dupOf(r){return S.recs.find(x=>x.part.replace(/\s/g,'')===r.part.replace(/\s/g,'')&&x.occDate===r.occDate)}
function showImp(){
  if(!IMP.length){$('#impv').innerHTML='<div class="hint">양식에 맞는 시트를 찾지 못했습니다.</div>';return}
  $('#impv').innerHTML=`<div class="tw"><table class="t"><tr><th><input type="checkbox" checked onchange="document.querySelectorAll('.impc').forEach(c=>c.checked=this.checked)"></th><th>품명</th><th>고객사</th><th>발생일</th><th class="c">점수</th><th>비고</th></tr>${IMP.map((r,i)=>{const d=dupOf(r);return`<tr><td><input type="checkbox" class="impc" data-i="${i}" ${d?'':'checked'}></td><td><b>${esc(r.part)}</b><div class="muted">${esc(r.src)}</div></td><td>${esc(custLabel(r))}</td><td class="nw">${fmtD(r.occDate)}</td><td class="c">${complete(r)?total(r):'-'}</td><td>${d?'<span class="tag w">중복(덮어쓰기)</span>':'<span class="tag ok">신규</span>'}</td></tr>`}).join('')}</table></div>
  <div style="margin-top:10px"><button class="btn p" onclick="doImp()">선택 항목 가져오기</button></div>`;
}
function doImp(){
  let a=0,u=0;
  document.querySelectorAll('.impc:checked').forEach(c=>{
    const r=IMP[+c.dataset.i];r.ua=nowISO();r.src='엑셀 가져오기: '+r.src;
    const d=dupOf(r);
    if(d){r.id=d.id;r.appr=d.appr;r.created=d.created;for(const k of ['files','acts','mons','xdel','monFrom','legacy'])if(d[k]!==undefined)r[k]=d[k];S.recs[S.recs.indexOf(d)]=r;u++}else{S.recs.push(r);a++}
  });
  saveLocal();schedulePush();IMP=[];toast(`신규 ${a}건 · 갱신 ${u}건`);render();
}
function exportXlsx(list){
  if(!window.XLSX){toast('엑셀 라이브러리를 불러오지 못했습니다');return}
  const rows=list.map(r=>{const o={'관리번호':recNo(r),'고객사':r.cust,'발생처상세':r.site,'차종':r.car,'품명':r.part,'발생일':r.occDate,'발생수량':r.qty,'불량내용/원인':r.cause,'개선대책':r.action,'대책완료일':r.doneDate,'평가예정일':r.dueDate,'점검일':r.chkDate,'점검자':r.inspector};
    ITEMS.forEach((it,i)=>{o[`${i+1}.평점(${it.m})`]=r.scores[i];o[`${i+1}.평가의견`]=r.opinions[i]});
    o['종합의견']=r.summary;o['종합의견평점(20)']=r.scores[8];o['합계']=complete(r)?total(r):'';o['판정']=judge(r)?JT[judge(r)][0]:'';o['상태']=STT[status(r)][0];
    o['검토']=r.appr&&r.appr.review?r.appr.review.n+' '+r.appr.review.d:'';o['승인']=r.appr&&r.appr.approve?r.appr.approve.n+' '+r.appr.approve.d:'';
    o['대책서첨부']=hasDoc(r)?'O':'X';o['증빙첨부']=(r.files||[]).length;o['증빙연결항목']=evCover(r)+'/'+ITEMS.length;
    o['要후속조치']=(r.acts||[]).length;o['要미완료']=openActs(r).length;o['要미완료내용']=openActs(r).map(a=>a.text+(a.owner?' ('+a.owner+')':'')+(a.due?' ~'+a.due:'')).join('\n');
    monList(r).forEach(x=>{o[x.m+'개월 확인']=x.res?(x.res.res==='OK'?'재발없음':'재발')+' '+x.res.d:(x.active?'예정 '+x.due:'대상외')});return o});
  const ws=XLSX.utils.json_to_sheet(rows),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'유효성검증');
  XLSX.writeFile(wb,'품질개선_유효성검증_'+today()+'.xlsx');
}
function backup(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='유효성검증_백업_'+today()+'.json';a.click()}
function restore(f){if(!f)return;const fr=new FileReader();fr.onload=e=>{try{const j=JSON.parse(e.target.result);if(!Array.isArray(j.recs))throw 0;if(!confirm(j.recs.length+'건으로 병합 복원합니다.'))return;j.recs.forEach(r=>r.ua=nowISO());S=mergeState(S,j);saveLocal();schedulePush();render();toast('복원 완료')}catch(x){toast('백업 파일 형식 오류')}};fr.readAsText(f)}

/* ---------- config ---------- */
function vCfg(){
  const a=isAppr(),dis=a?'':'disabled';
  let h=`<div class="ph"><h2>기준정보</h2>${a?'':'<span class="muted">변경은 승인자만 가능합니다</span>'}</div>
  <div class="grid2"><div class="panel"><h3>체크 항목 · 배점 <span class="muted">${FORM_NO}</span></h3><div class="tw"><table class="t"><tr><th>구분</th><th>NO</th><th>체크 항목</th><th class="c">배점</th></tr>${ITEMS.map((it,i)=>`<tr><td class="nw">${esc(it.g)}</td><td>${i+1}</td><td>${esc(it.t)}</td><td class="c">${it.m}</td></tr>`).join('')}<tr><td>종합의견</td><td></td><td>점검자 종합의견</td><td class="c">${SUM_MAX}</td></tr><tr><td colspan="3" class="rt"><b>합계</b></td><td class="c"><b>100</b></td></tr></table></div>
  <div class="muted" style="margin-top:8px">판정: 80점 이상 Accept / 60점 이상 Reject(기존대책 보완) / 60점 미만 Reject(대책 재수립)</div></div>
  <div><div class="panel"><h3>고객사 목록</h3><div class="f"><textarea id="c_custs" ${dis} style="min-height:120px">${esc(S.cfg.custs.join('\n'))}</textarea></div><div class="muted">한 줄에 하나씩. 발생처 상세(공장·라인)는 등록 시 별도 입력.</div>
   <div class="f" style="margin-top:10px;max-width:220px"><label>평가 예정일 = 대책 완료일 + (일)</label><input id="c_due" type="number" value="${S.cfg.dueDays}" ${dis}></div></div>
  <div class="panel"><h3>사용자 (PIN)</h3><div class="tw"><table class="t"><tr><th>이름</th><th>권한</th>${a?'<th>PIN</th><th></th>':''}</tr>${S.cfg.users.map((u,i)=>`<tr><td>${esc(u.n)}</td><td>${u.r==='A'?'<span class="tag b">승인자</span>':'<span class="tag n">작성자</span>'}</td>${a?`<td>${esc(u.pin)}</td><td><button class="btn s d" onclick="delUser(${i})">삭제</button></td>`:''}</tr>`).join('')}</table></div>
   ${a?`<div class="flt" style="margin-top:10px"><input id="u_n" placeholder="이름" style="width:110px"><input id="u_p" placeholder="PIN 4자리" inputmode="numeric" style="width:110px"><select id="u_r"><option value="W">작성자</option><option value="A">승인자</option></select><button class="btn" onclick="addUser()">추가</button></div>`:''}</div>
  ${a?`<button class="btn p" onclick="saveCfg()">💾 기준정보 저장</button>`:''}</div></div>`;
  return h;
}
function saveCfg(){
  S.cfg.custs=$('#c_custs').value.split('\n').map(s=>s.trim()).filter(Boolean);
  S.cfg.dueDays=Math.max(0,+$('#c_due').value||30);S.cfg.ua=nowISO();saveLocal();schedulePush();toast('저장되었습니다');render();
}
function addUser(){
  const n=$('#u_n').value.trim(),p=$('#u_p').value.trim(),r=$('#u_r').value;
  if(!n||!/^\d{4,6}$/.test(p)){toast('이름과 PIN(4~6자리 숫자)을 입력하세요');return}
  if(S.cfg.users.some(u=>u.pin===p)){toast('이미 사용 중인 PIN입니다');return}
  S.cfg.users.push({pin:p,n,r});S.cfg.ua=nowISO();saveLocal();schedulePush();render();
}
function delUser(i){
  const u=S.cfg.users[i];if(S.cfg.users.filter(x=>x.r==='A').length<=1&&u.r==='A'){toast('승인자는 최소 1명 필요합니다');return}
  if(!confirm(u.n+' 삭제?'))return;S.cfg.users.splice(i,1);S.cfg.ua=nowISO();saveLocal();schedulePush();render();
}

/* ---------- boot ---------- */
(function(){
  const l=loadLocal();
  if(l){S=mergeState({recs:[],del:{},cfg:DEF_CFG},l);migrate(S)}else{S.recs=seedRecs();S._fresh=true}
  render();
  sync(true);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
  window.addEventListener('online',()=>sync());
})();
</script>
